<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Studeasy</title>
        <meta name="description"
            content="Перегляд і налаштування профілю користувача Studeasy">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <p>Studeasy</p>
            <a href="index.html">Головна</a>
            <a href="about.html">Про проєкт</a>
            <a href="profile.html">Профіль</a>
            <hr>
        </header>
        <main>
            <h1>Профіль користувача</h1>
            <form>
                <fieldset>
                    <legend>Особиста інформація</legend>
                    <label for="useravatar">Аватар:</label>
                        <input type="file" id="useravatar">
                    <label for="first-name">Ім'я:</label>
                        <input type="text" id="first-name" value="Богдан" placeholder="Введіть ваше ім'я" required>
                    <label for="last-name">Прізвище:</label>
                        <input type="text" id="last-name" value="Кріль" placeholder="Введіть ваше прізвище">
                    <label for="email">Email:</label>
                        <input type="email" id="email" value="kril.bohdan@example.com" placeholder="Введіть ваш email" required>
                    <label for="password">Пароль:</label>
                        <input type="password" id="password" value="********" placeholder="Введіть ваш пароль" required>
                    <button type="submit">Зберегти зміни</button>
                </fieldset>
            </form>
        </main>
        <footer>
            <hr>
            <p>© 2026 Studeasy</p>
        </footer>
    </body>
